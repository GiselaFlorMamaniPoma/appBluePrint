<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %}</title>
    <!-- Tailwind CSS y Google Fonts para un toque editorial -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif-custom { font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 antialiased selection:bg-stone-800 selection:text-white">

    <!-- Barra de navegación superior minimalista y oscura -->
    <nav class="bg-stone-900 text-stone-300 py-4 px-6 border-b border-stone-800">
        <div class="max-w-3xl mx-auto flex justify-between items-center text-sm">
            <span class="font-semibold tracking-wider uppercase text-xs text-stone-400">Plantilla base de ---->GISELA FLOR MAMANI POMA</span>
            <a href="/blog" class="hover:text-white transition-colors">&larr; Volver al inicio</a>
        </div>
    </nav>

    <!-- Contenedor principal con estilo de papel/artículo -->
    <main class="max-w-3xl mx-auto my-12 px-6">
        <div class="bg-white p-8 md:p-12 shadow-sm border border-stone-200 rounded-none">
            {% block content %}
            <h2>LISTA DE PRODUCTOS EN EL BLOG</h2>
            <br>
            <br>
            
    <ul>
        <li>Gaseosas</li>
        <li>Lacteos</li>
        <li>Golosinas</li>
        <li>Galletas</li>
        <li>Gelatinas</li>
        <li>Chocolates</li>
        <li>Pasteles</li>
        <li>Empanadas</li>
        <li>Jugos</li>
        <li>Jugetes</li>
    </ul>
            {% endblock %}
        </div>
    </main>

    <!-- Pie de página minimalista -->
    <footer class="text-center py-8 text-stone-400 text-xs tracking-wide uppercase border-t border-stone-200 max-w-3xl mx-auto">
        &copy; 2026 &bull; TECNOLOGIAS EMERGENTES 
    </footer>

</body>
</html>
