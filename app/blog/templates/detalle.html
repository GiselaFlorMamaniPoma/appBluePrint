{% extends "blog/base_blog.html" %}

{% blog title %}{{ titulo }}{% endblog %}

{% blog content %}
<article class="space-y-6">
    <!-- Cabecera del artículo -->
    <header class="space-y-3 border-b border-stone-100 pb-6">
        <div class="flex items-center space-x-2 text-xs font-semibold tracking-widest text-stone-500 uppercase">
            <span>Artículo</span>
            <span>&bull;</span>
            <span>Lectura de 3 min</span>
        </div>
        <h1 class="font-serif-custom text-3xl md:text-4xl font-bold text-stone-900 leading-tight">
            {{ titulo }}
        </h1>
    </header>
    
    <!-- Cuerpo del texto -->
    <div class="font-serif-custom text-stone-700 leading-relaxed space-y-4 text-base md:text-lg font-light">
        <p>{{ contenido }}</p>
    </div>

    <!-- Enlaces de navegación inferior -->
    <div class="pt-8 border-t border-stone-100 flex justify-between items-center text-sm">
        <a href="/entrada/1" class="text-stone-900 font-medium hover:underline flex items-center gap-1">
            &larr; Entrada anterior
        </a>
        <a href="/" class="text-stone-500 hover:text-stone-900 transition-colors">
            Índice general
        </a>
    </div>
</article>
{% endblog %}
